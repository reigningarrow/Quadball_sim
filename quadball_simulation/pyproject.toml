[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadball-sim"
version = "0.1.0"
description = "A deterministic 2D multi-agent quadball simulation and learning environment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Simulation Project"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
render = ["pygame>=2.5"]
rl = ["gymnasium>=0.29"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["pygame>=2.5", "gymnasium>=0.29", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
quadball = "quadball.cli:main"

[tool.setuptools.packages.find]
include = ["quadball*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
